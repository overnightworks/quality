# The one gitleaks config of the fleet gate: the scanned repository's own .gitleaks.toml is never read.
# A known false positive is allowed only by its rule, file and secret hash in quality/config.toml [secrets] allow.
[extend]
useDefault = true

# The allowance's own hash is a 64-hex string that generic-api-key reads as a key. Only a finding whose whole secret
# is such a hash, in that file, is dropped: another key on the same line is still reported.
[[allowlists]]
description = "secret_sha256 values of quality/config.toml"
condition = "AND"
paths = ['''^quality/config\.toml$''']
regexes = ['''^[0-9a-f]{64}$''']
