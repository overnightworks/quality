[project]
name = "overnightworks-quality"
dynamic = ["version"]
description = "One door for fleet quality checks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6",
    "import-linter==2.16",
    # grimp 3.20: architecture.py implements its internal package-finder port, so an upgrade is a reviewed bump
    "grimp==3.20",
    "lizard==1.26.1",
    # design v0.36.0: the full commit of its release tag, because quality is installed without a lock
    "overnightworks-design[po] @ git+https://github.com/overnightworks/design@e1b4a448a9e4d86539f4f2ef05f5267a4b52fe36",
    # logline v1.10.0: the full commit of its release tag, because quality is installed without a lock
    "overnightworks-logline @ git+https://github.com/overnightworks/logline@c8eeea08873719d9521553a95fb2d5b9fcbe11a5",
    "packaging>=24",
    "ruff==0.17.5",
    "zizmor==1.32.0",
]

[project.scripts]
quality = "quality.cli:run"

[dependency-groups]
dev = ["pytest", "pytest-cov", "pytest-randomly", "pytest-xdist"]

[build-system]
requires = ["hatchling==1.33.0", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4", "vcs-versioning==2.6.0"]
build-backend = "hatchling.build"

# uv resolves the project before quality runs, so the tool is its own workspace root and a caller's checkout above it cannot take it in or configure it
[tool.uv.workspace]
members = []

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/quality"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
external = ["S", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "unit: starts no process and opens no socket in its setup or call (the audit events in STARTING_EVENTS, tests/conftest.py)",
    "integration: starts a process or opens a socket in its setup or call (the audit events in STARTING_EVENTS, tests/conftest.py)",
    "scanner: runs a real scanner that mise installed from quality's manifest (CI installs them)",
]

[tool.coverage.run]
source_pkgs = ["quality"]
source_dirs = ["scripts"]
branch = true
patch = ["subprocess"]
relative_files = true

[tool.importlinter]
root_packages = ["quality"]

[[tool.importlinter.contracts]]
name = "quality's layers, top to bottom"
type = "layers"
containers = ["quality"]
exhaustive = true
layers = [
    "cli",
    "cli_help",
    "merge",
    "landing | base_branch",
    "verdict",
    "sides | gh",
    "sonar_properties | sonar_scanner",
    "sonar | fleet",
    "check | staged",
    "pin",
    "advisories",
    "python_lint",
    "literal_text | locator_text | logging_rule",
    "render_pass",
    "catalog_rules",
    "pr_workflows | pytest_random",
    "read_attributes | typescript_tokens",
    "twins",
    "naming",
    "agent_guidance | architecture | clones | compose | env_file | fleet_sources | layout | pip_requirements | python_floor | root_layout | scanners | workflow_rules",
    "makefile | pytest_options | workflow_document",
    "run_script",
    "ratchet",
    "ratchet_scripts",
    "baseline_file",
    "checkout",
    "fleet_ci_time",
    "fleet_job_time",
    "output",
    "web",
    "deadline | ci_time",
    "report",
    "config",
    "repository",
    "process",
    "rules",
    "installation",
]
