[project]
name = "overnightworks-quality"
dynamic = ["version"]
description = "One door for fleet quality checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "lizard>=1.24.1,<1.25"]

[project.scripts]
quality = "quality.cli:main"

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/quality/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quality"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: runs a real downloaded engine process (needs network; CI runs it)"]

[tool.coverage.run]
source_pkgs = ["quality"]
relative_files = true
