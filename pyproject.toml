[project]
name = "overnightworks-quality"
dynamic = ["version"]
description = "One door for fleet quality checks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6",
    "import-linter==2.15",
    "lizard>=1.24.1,<1.26",
    "overnightworks-design[po] @ https://github.com/overnightworks/design/releases/download/v0.36.0/overnightworks_design-0.36.0-py3-none-any.whl#sha256=a0b8fe02f2715feca2a307c39c0998036e5a72f6a01f1af8e9a0d5bcbd066b92",
    "packaging>=24",
    "ruff==0.17.4",
    "zizmor==1.32.0",
]

[project.scripts]
quality = "quality.cli:run"

[dependency-groups]
dev = ["pytest", "pytest-cov", "pytest-xdist"]

[build-system]
requires = ["hatchling==1.33.0", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4", "vcs-versioning==2.6.0"]
build-backend = "hatchling.build"

# uv resolves the project before quality runs, so the tool is its own workspace root and a caller's checkout above it cannot take it in or configure it
[tool.uv.workspace]
members = []

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/quality"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
external = ["S", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "unit: starts no process and opens no socket in its setup or call (the audit events in STARTING_EVENTS, tests/conftest.py)",
    "integration: starts a process or opens a socket in its setup or call (the audit events in STARTING_EVENTS, tests/conftest.py)",
    "scanner: runs a real scanner that mise installed from quality's manifest (CI installs them)",
]

[tool.coverage.run]
source_pkgs = ["quality"]
source_dirs = ["scripts"]
branch = true
patch = ["subprocess"]
relative_files = true

[tool.importlinter]
root_packages = ["quality"]

[[tool.importlinter.contracts]]
name = "quality's layers, top to bottom"
type = "layers"
containers = ["quality"]
exhaustive = true
layers = [
    "cli",
    "cli_help",
    "merge",
    "landing | base_branch",
    "verdict",
    "sides | gh",
    "sonar_properties | sonar_scanner",
    "sonar | fleet",
    "check | staged",
    "pin",
    "advisories",
    "python_lint",
    "literal_text | locator_text",
    "render_pass",
    "catalog_rules",
    "read_attributes | typescript_tokens",
    "agent_guidance | architecture | clones | compose | env_file | fleet_sources | layout | pip_requirements | python_floor | root_layout | scanners | workflow_rules",
    "makefile",
    "run_script",
    "ratchet",
    "baseline_file",
    "checkout",
    "output",
    "web",
    "deadline",
    "report",
    "config",
    "repository",
    "process",
    "rules",
    "installation",
]
