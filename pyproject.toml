[project]
name = "overnightworks-quality"
dynamic = ["version"]
description = "One door for fleet quality checks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6",
    "import-linter==2.15",
    "lizard>=1.24.1,<1.25",
]

[project.scripts]
quality = "quality.cli:run"

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov"]

[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4", "vcs-versioning==2.6.0"]
build-backend = "hatchling.build"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/quality"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = ["engine: runs a real downloaded engine process (needs network; CI runs it)"]

[tool.coverage.run]
source_pkgs = ["quality"]
relative_files = true

[tool.importlinter]
root_packages = ["quality"]

[[tool.importlinter.contracts]]
name = "quality's layers, top to bottom"
type = "layers"
containers = ["quality"]
exhaustive = true
layers = [
    "cli",
    "emergency",
    "verdict",
    "sonar | scoreboard",
    "hygiene | staged",
    "advisories",
    "architecture | clones | engines",
    "ratchet",
    "report",
    "config",
    "repository",
]
