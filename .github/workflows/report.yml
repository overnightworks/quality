name: report

# Report only: the run writes to no repository and opens no issue; its table stands in the run summary.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    name: fleet report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Sync
        run: uv sync --locked

      # exec 2>&1 sends stderr into stdout's pipe, so the log keeps the order the report writes; the door writes the step summary itself.
      # quality/fleet.toml names the organizations; the job's read-only token lists their public repositories and git clones them anonymously. A repository that is not anonymously readable is not measured: this run is public.
      - name: Measure the fleet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          exec 2>&1
          uv run --locked quality report
