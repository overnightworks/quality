name: report

# The run writes to no repository and opens no issue: its tables stand in the run summary, and the weekly CI-time file goes to the repository's GitHub Pages from the publish job alone, which holds the Pages permissions and deploys only from the default branch.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    name: fleet report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Sync
        run: uv sync --locked

      # exec 2>&1 sends stderr into stdout's pipe, so the log keeps the order the report writes; the door writes the step summary itself.
      # quality/fleet.toml names the organizations; the job's read-only token lists their public repositories and git clones them anonymously. A repository that is not anonymously readable is not measured: this run is public.
      - name: Measure the fleet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          exec 2>&1
          mkdir site
          uv run --locked quality report --ci-time-json site/fleet-ci-time.json

      # A red report still uploads the file it wrote; a run that wrote none uploads nothing.
      - name: Upload the CI-time file
        if: ${{ !cancelled() && hashFiles('site/fleet-ci-time.json') != '' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # The branch condition keeps a dispatch from another branch from deploying, whatever the environment's branch policy is.
  publish:
    name: publish the CI-time file
    needs: report
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write # deploys the Pages artifact
      id-token: write # proves to Pages that this run made the artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
