name: codeql

on:
  workflow_call:
    inputs:
      languages:
        description: JSON list of the CodeQL languages to analyse, for example '["actions", "python"]'
        type: string
        required: true
      config-file:
        description: Path in the caller's checkout of a CodeQL configuration file, for example '.github/codeql/codeql-config.yml'; empty runs CodeQL's defaults
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ inputs.config-file }}

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
