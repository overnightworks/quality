name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/codeql.yml
    with:
      languages: '["actions", "python"]'
