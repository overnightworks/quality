# Caller contract: the caller job's id is `quality`, with `needs:` naming the jobs of `quality/config.toml`
# `[gate] mandatory_jobs`, `if: always()`, `permissions: contents: read, actions: read` (without `actions: read` the run
# fails at startup and no verdict exists) and `secrets: SONAR_TOKEN`. See docs/gate.md.
# SonarCloud scan transport (SonarSource/sonarqube-scan-action v8.2.1 with sonar-scanner-cli 8.1.0.6389, which
# bundles sonar-scanner-java-library 4.1.1.1633). What is verified and what is trusted:
#  - The bootstrap's authenticated requests reach only sonarcloud.io and api.sonarcloud.io. That holds only with the
#    pinned -Dsonar.host.url=https://sonarcloud.io below and a sonar-project.properties that `quality sonar preflight`
#    accepted: its allowlist keeps endpoint, region and proxy keys out, and refuses any ${...} substitution.
#  - Residual limit: ScannerHttpClient follows redirects by hand with the token attached, so a redirect issued by
#    SonarCloud itself would carry the token to the host it names. SonarCloud already receives the token.
#  - The scanner engine is downloaded from SonarCloud and is not pinned by the CLI pin. SonarSource's server-side
#    code is an accepted trust boundary: the token's only purpose is to authenticate to SonarCloud.
#  - Re-verify all of this on any bump of the scan action or of scannerVersion. Sources at 4.1.1.1633:
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.1.1.1633/lib/src/main/java/org/sonarsource/scanner/lib/internal/http/HttpClientFactory.java#L72
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.1.1.1633/lib/src/main/java/org/sonarsource/scanner/lib/internal/http/ScannerHttpClient.java#L162-L170
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.1.1.1633/lib/src/main/java/org/sonarsource/scanner/lib/internal/http/ScannerHttpClient.java#L231-L233
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.1.1.1633/lib/src/main/java/org/sonarsource/scanner/lib/internal/endpoint/ScannerEndpointResolver.java#L40
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.1.1.1633/lib/src/main/java/org/sonarsource/scanner/lib/internal/facade/forked/ScannerEngineLauncherFactory.java
name: gate

on:
  workflow_call:
    inputs:
      coverage-artifact:
        description: Name of an artifact the caller's tests job uploaded in this run; the sonar job downloads it into the checkout
        type: string
        required: false
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TOOL_DIR: ${{ github.repository == 'overnightworks/quality' && '.' || '.gate-tool' }}
    steps:
      - name: Check out the caller with its full history for the secret scan
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the gate's own tool
        if: github.repository != 'overnightworks/quality'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: overnightworks/quality
          ref: 0862bfcaf6f2d508016e9f8cd995978cc2813e44
          path: .gate-tool
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Install the pinned engines
        run: uv run --locked --project "$TOOL_DIR" quality engines install "$RUNNER_TEMP/engines"

      - name: Hygiene
        run: uv run --locked --project "$TOOL_DIR" quality hygiene --engines "$RUNNER_TEMP/engines" .

  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TOOL_DIR: ${{ github.repository == 'overnightworks/quality' && '.' || '.gate-tool' }}
    steps:
      - name: Check out the caller with its full history for the scan
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the coverage report this run's tests wrote
        if: inputs.coverage-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}

      - name: Check out the gate's own tool
        if: github.repository != 'overnightworks/quality'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: overnightworks/quality
          ref: 0862bfcaf6f2d508016e9f8cd995978cc2813e44
          path: .gate-tool
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Refuse a token or properties file that could steer the scan
        id: preflight
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: uv run --locked --project "$TOOL_DIR" quality sonar preflight .

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.1.0.6389
          args: -Dsonar.host.url=https://sonarcloud.io -Dsonar.qualitygate.wait=false ${{ steps.preflight.outputs.scanner-arguments }}

      - name: Findings of this run's own analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --locked --project "$TOOL_DIR" quality sonar findings

  verdict:
    needs: [hygiene, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the caller with history for the base config
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the gate's own tool
        if: github.repository != 'overnightworks/quality'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: overnightworks/quality
          ref: 0862bfcaf6f2d508016e9f8cd995978cc2813e44
          path: .gate-tool
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Verdict
        env:
          TOOL_DIR: ${{ github.repository == 'overnightworks/quality' && '.' || '.gate-tool' }}
          GITHUB_TOKEN: ${{ github.token }}
          GATE_NEEDS: ${{ toJSON(needs) }}
          GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: uv run --locked --project "$TOOL_DIR" quality verdict .
