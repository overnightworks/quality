# Caller contract: the caller job's id is `quality`, with `needs:` naming the jobs of `quality/config.toml`
# `[gate] mandatory_jobs`, `if: always()`, `permissions: contents: read, actions: read` (without `actions: read` the run
# fails at startup and no verdict exists) and, unless `quality/config.toml` sets `[gate] sonar = false`,
# `secrets: SONAR_TOKEN`. See docs/gate.md.
# SonarCloud scan transport (SonarSource/sonarqube-scan-action v8.4.0 with sonar-scanner-cli 8.3.1.16491, which
# bundles sonar-scanner-java-library 4.2.1.1698). What is verified and what is trusted:
#  - The scanner CLI is installed by `quality sonar scanner` before the scan: it downloads the zip and its signature
#    from binaries.sonarsource.com and installs the zip only when the signature, checked by gpg against the key file
#    src/quality/sonarsource-scanner-key.asc, is by the primary key whose fingerprint the install step names. The action
#    then finds the scanner in the runner tool cache and fetches no key; its own download address is unreachable, so a
#    changed cache layout fails the scan at the download instead of falling back to a key server. A cache hit is trusted
#    as found: with the directory and its marker present nothing is verified again, and on a GitHub-hosted runner the
#    tool cache starts empty.
#  - The bootstrap's authenticated requests reach only sonarcloud.io and api.sonarcloud.io. That holds only with the
#    pinned -Dsonar.host.url=https://sonarcloud.io below, a sonar-project.properties that `quality sonar properties`
#    accepted (its allowlist keeps the endpoint, region, proxy, token and sonar.scanner.httpExtraHeaders keys out and
#    refuses any ${...} substitution) and a job environment that sets none of SONAR_HOST_URL, SONAR_REGION,
#    SONAR_SCANNER_*, SONAR_SCANNER_JSON_PARAMS and SONARQUBE_SCANNER_PARAMS, which the library reads as properties:
#    only the steps below set environment variables, and none of those.
#  - Residual limit: ScannerHttpClient follows redirects by hand with the token attached, so a redirect issued by
#    SonarCloud itself would carry the token to the host it names. SonarCloud already receives the token.
#  - The scanner engine is downloaded from SonarCloud and is not pinned by the CLI pin. SonarSource's server-side
#    code is an accepted trust boundary: the token's only purpose is to authenticate to SonarCloud.
#  - Re-verify all of this on any bump of the scan action or of SCANNER_VERSION; the scan's log must say
#    `Using cached Sonar Scanner CLI`. Re-pinning and key rotation: docs/sonar.md, "Re-pinning the key". Sources at
#    4.2.1.1698:
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/internal/endpoint/ScannerEndpointResolver.java#L39-L44
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/internal/endpoint/ScannerEndpointResolver.java#L86-L104
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/internal/endpoint/OfficialSonarQubeCloudInstance.java#L33-L34
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/internal/http/HttpClientFactory.java#L72
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/internal/http/ScannerHttpClient.java#L162-L172
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/internal/http/ScannerHttpClient.java#L227-L233
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/internal/facade/forked/ScannerEngineLauncherFactory.java#L81-L82
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/internal/facade/forked/ScannerEngineLauncherFactory.java#L99-L106
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/internal/facade/forked/ScannerEngineLauncherFactory.java#L123-L130
#      https://github.com/SonarSource/sonar-scanner-java-library/blob/4.2.1.1698/lib/src/main/java/org/sonarsource/scanner/lib/EnvironmentConfig.java#L50-L76
name: gate

on:
  workflow_call:
    inputs:
      coverage-artifact:
        description: Name of an artifact the caller's tests job uploaded in this run; the sonar job downloads it into the checkout
        type: string
        required: false
        default: ''
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TOOL_DIR: ${{ github.repository == 'overnightworks/quality' && '.' || '.gate-tool' }}
    steps:
      - name: Check out the caller with its full history for the secret scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the gate's own tool
        if: github.repository != 'overnightworks/quality'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: overnightworks/quality
          ref: v0.16.0
          path: .gate-tool
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Install the pinned scanners
        timeout-minutes: 2
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: v2026.10.23
          sha256: a6ac620e73fb58cefbdfef8fb154856fbd8ae08d75ae88103e4b81daef3a836e
          working_directory: ${{ env.TOOL_DIR }}/src/quality/mise
          install_args: --locked
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false
        env:
          MISE_HTTP_RETRIES: 4
          MISE_CEILING_PATHS: ${{ github.workspace }}${{ env.TOOL_DIR != '.' && format('/{0}', env.TOOL_DIR) || '' }}/src/quality

      - name: Check
        run: uv run --locked --project "$TOOL_DIR" quality check

  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TOOL_DIR: ${{ github.repository == 'overnightworks/quality' && '.' || '.gate-tool' }}
      SCANNER_VERSION: 8.3.1.16491
    steps:
      - name: Check out the caller with its full history for the scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the coverage report this run's tests wrote
        if: inputs.coverage-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}

      - name: Check out the gate's own tool
        if: github.repository != 'overnightworks/quality'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: overnightworks/quality
          ref: v0.16.0
          path: .gate-tool
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Refuse a token or properties file that could steer the scan
        id: preflight
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: uv run --locked --project "$TOOL_DIR" quality sonar properties

      - name: Install the pinned scanner
        timeout-minutes: 2
        if: steps.preflight.outputs.sonar != 'off'
        env:
          SCANNER_SIGNER_FINGERPRINT: 679F1EE92B19609DE816FDE81DB198F93525EC1A
        run: uv run --locked --project "$TOOL_DIR" quality sonar scanner

      - name: Scan
        timeout-minutes: 3
        if: steps.preflight.outputs.sonar != 'off'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: ${{ env.SCANNER_VERSION }}
          scannerBinariesUrl: https://scanner-binaries.invalid
          args: -Dsonar.host.url=https://sonarcloud.io -Dsonar.qualitygate.wait=false ${{ steps.preflight.outputs.scanner-arguments }}

      - name: Findings of this run's own analysis
        if: steps.preflight.outputs.sonar != 'off'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --locked --project "$TOOL_DIR" quality sonar findings

  verdict:
    needs: [check, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the caller with history for the base config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the gate's own tool
        if: github.repository != 'overnightworks/quality'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: overnightworks/quality
          ref: v0.16.0
          path: .gate-tool
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Verdict
        env:
          TOOL_DIR: ${{ github.repository == 'overnightworks/quality' && '.' || '.gate-tool' }}
          GITHUB_TOKEN: ${{ github.token }}
          GATE_NEEDS: ${{ toJSON(needs) }}
          GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          GATE_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          GATE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: uv run --locked --project "$TOOL_DIR" quality verdict
