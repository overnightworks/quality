name: release-gate

# Caller contract: docs/release.md. It only reads, so every refusal stands before any tag exists.
on:
  workflow_call:
    inputs:
      version:
        description: The version to release, in the form that form names
        type: string
        required: true
      form:
        description: The version's form, X.Y.Z or YYYY.MM.DD.N
        type: string
        required: false
        default: X.Y.Z
    outputs:
      commit:
        description: The gated commit, main's head when the release was dispatched
        value: ${{ jobs.gate.outputs.commit }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # CI's push run on the commit and its jobs
      checks: read # the verdict of the pull request that merged the commit
      contents: read # main's head and the tags
      pull-requests: read # which pull request merged the commit
    outputs:
      commit: ${{ steps.merged.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ github.sha }}
      FORM: ${{ inputs.form }}
    steps:
      - name: Refuse any ref but main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Refused: dispatched from $DISPATCH_REF, a release is dispatched from main." >&2
            exit 1
          fi

      - name: Refuse a malformed version
        id: form
        env:
          X_Y_Z: '^(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)$'
          YYYY_MM_DD_N: '^[0123456789]{4}\.(0[123456789]|1[012])\.(0[123456789]|[12][0123456789]|3[01])\.[123456789][0123456789]*$'
        run: |
          case "$FORM" in
            X.Y.Z) grammar=$X_Y_Z rule="each part a number without leading zeros" ;;
            YYYY.MM.DD.N) grammar=$YYYY_MM_DD_N rule="month 01 to 12, day 01 to 31, N a number from 1 without leading zeros" ;;
            *) echo "Refused: the form $FORM is neither X.Y.Z nor YYYY.MM.DD.N." >&2; exit 1 ;;
          esac
          if ! [[ "$VERSION" =~ $grammar ]]; then
            echo "Refused: the version is not $FORM, $rule." >&2
            exit 1
          fi
          echo "grammar=$grammar" >> "$GITHUB_OUTPUT"

      - name: Refuse unless the commit is still main's head
        run: |
          main_head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main_head" != "$COMMIT" ]; then
            echo "Refused: main moved from $COMMIT to $main_head after the dispatch." >&2
            exit 1
          fi

      - name: Refuse a tag that exists
        run: |
          taken=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" \
            --jq '[.[] | select(.ref == "refs/tags/v" + env.VERSION)] | length')
          if [ "$taken" != "0" ]; then
            echo "Refused: the tag v$VERSION exists." >&2
            exit 1
          fi

      - name: Refuse a commit that already carries a release tag
        env:
          RELEASE_FORM: ${{ steps.form.outputs.grammar }}
        run: |
          tagged=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            --jq '.[] | select(.commit.sha == env.COMMIT) | .name')
          for tag in $tagged; do
            if [[ "$tag" == v* && "${tag#v}" =~ $RELEASE_FORM ]]; then
              echo "Refused: $COMMIT already carries the release tag $tag." >&2
              exit 1
            fi
          done

      - name: Refuse unless CI's newest push run on the commit is green with a green quality verdict
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$COMMIT&per_page=100" \
            --jq '.workflow_runs | max_by(.id) // empty | "\(.id) \(.status) \(.conclusion)"')
          if [ -z "$run" ]; then
            echo "Refused: CI has no push run on $COMMIT." >&2
            exit 1
          fi
          read -r run_id status conclusion <<<"$run"
          if [ "$status" != "completed" ]; then
            echo "Refused: CI's push run $run_id is $status." >&2
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "Refused: CI's push run $run_id concluded $conclusion." >&2
            exit 1
          fi
          verdict=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "quality / verdict")][0].conclusion // "missing"')
          if [ "$verdict" != "success" ]; then
            echo "Refused: the quality / verdict of CI's push run $run_id is $verdict." >&2
            exit 1
          fi

      - name: Refuse a commit its pull request merged without a green quality verdict
        id: merged
        run: |
          pull=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | if length == 1 then "\(.[0].number) \(.[0].head.sha) \(.[0].merged_at)" else empty end')
          if [ -z "$pull" ]; then
            echo "Refused: no single pull request merged $COMMIT into main." >&2
            exit 1
          fi
          read -r number head merged_at <<<"$pull"
          # Only check runs finished by the merge count, so a re-run after an emergency merge never lifts this refusal.
          verdict=$(MERGED_AT="$merged_at" gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=quality%20%2F%20verdict&filter=all&per_page=100" \
            --jq '[.check_runs[] | select(.completed_at != null and .completed_at <= env.MERGED_AT)] | max_by(.id) | .conclusion // "missing"')
          if [ "$verdict" != "success" ]; then
            echo "Refused: pull request #$number merged with quality / verdict $verdict; release the next commit merged with a green verdict." >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
