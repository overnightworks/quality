name: Release

# The operator dispatches it: gh workflow run release.yml -R overnightworks/quality -f version=X.Y.Z (docs/release.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gate:
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: $/.github/workflows/release-gate.yml
    with:
      version: ${{ inputs.version }}

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - name: Check out the dispatched commit with its history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse unless the checkout is the commit the gate judged
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then
            echo "Refused: the checkout is $head, not the gated commit $COMMIT." >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.4'
          python-version: '3.14'

      # This tag never leaves the runner: the job's token only reads.
      - name: Refuse unless the commit, tagged here, is the release its version names
        run: |
          git tag "v$VERSION" "$COMMIT"
          uv sync --locked --reinstall-package overnightworks-quality
          uv run --locked python scripts/verify_release.py

  tag:
    needs: [gate, build]
    permissions:
      contents: write
    uses: $/.github/workflows/release-tag.yml
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
