name: scoreboard

# Report only: the run writes to no repository and opens no issue; its table stands in the run summary.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  scoreboard:
    name: fleet scoreboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Sync
        run: uv sync --locked

      # The fleet list lives in quality/fleet.toml. A repository that is not anonymously readable is not measured: this run is public.
      - name: Measure the fleet
        run: uv run --locked quality scoreboard
