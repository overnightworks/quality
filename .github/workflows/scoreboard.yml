name: scoreboard

# Report only: the run writes to no repository and opens no issue; its table stands in the run summary.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  scoreboard:
    name: fleet scoreboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          python-version: '3.12'

      - name: Sync
        run: uv sync --locked

      # The fleet list lives here and only here. A private repository is never measured: this run is public.
      - name: Measure the fleet
        run: >-
          uv run --locked quality scoreboard
          https://github.com/overnightworks/quality
          https://github.com/overnightworks/agent-coordination
          https://github.com/overnightworks/songmaker
          https://github.com/overnightworks/agent-presentator
          https://github.com/overnightworks/agent-providers
          https://github.com/overnightworks/webauth
          https://github.com/overnightworks/marketplace
          https://github.com/overnightworks/hopin
          https://github.com/overnightworks/ui-console
          --private
          https://github.com/overnightworks/edge
          https://github.com/overnightworks/kiln
          https://github.com/overnightworks/gmail-cleanup
          https://github.com/overnightworks/claudebot
          https://github.com/overnightworks/home-tools
