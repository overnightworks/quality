name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Sync
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check

      - name: Install the pinned scanners
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: v2026.10.23
          sha256: a6ac620e73fb58cefbdfef8fb154856fbd8ae08d75ae88103e4b81daef3a836e
          working_directory: src/quality/mise
          install_args: --locked
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false
        env:
          MISE_CEILING_PATHS: ${{ github.workspace }}/src/quality

      - name: Pytest
        run: uv run --locked pytest --cov --cov-report=xml

      - name: Keep the coverage report for the gate's scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  quality:
    if: always()
    needs: [tests]
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/gate.yml
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
