name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          python-version: '3.12'

      - name: Sync
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check

      - name: Pytest
        run: uv run --locked pytest

      - name: Hygiene on itself
        run: uv run --locked quality hygiene .

  quality:
    if: always()
    needs: [tests]
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/gate.yml
