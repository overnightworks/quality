name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.4'
          python-version: '3.14'

      - name: Sync
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check

      - name: Install the pinned scanners
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: v2026.10.23
          sha256: a6ac620e73fb58cefbdfef8fb154856fbd8ae08d75ae88103e4b81daef3a836e
          working_directory: src/quality/mise
          install_args: --locked
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false
        env:
          MISE_CEILING_PATHS: ${{ github.workspace }}/src/quality

      - name: Pytest
        run: uv run --locked pytest --cov --cov-report=xml

      - name: Keep the coverage report for the gate's scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  quality:
    if: always()
    needs: [tests]
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/gate.yml
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
